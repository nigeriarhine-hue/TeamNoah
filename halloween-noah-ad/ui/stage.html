<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Noah Halloween Stage</title>
<style>
@font-face{font-family:'Plus Jakarta Sans';font-weight:400;font-display:block;src:url(fonts/plus-jakarta-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-weight:500;font-display:block;src:url(fonts/plus-jakarta-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-weight:600;font-display:block;src:url(fonts/plus-jakarta-sans-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-weight:700;font-display:block;src:url(fonts/plus-jakarta-sans-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-weight:800;font-display:block;src:url(fonts/plus-jakarta-sans-latin-800-normal.woff2) format('woff2')}
:root{--desk:#0B1024;--navy:#1A1D61;--indigo:#6366F1;--violet:#8B5CF6;--blue:#5B8DEF;--lav:#C7CBFF;
  --win:#16181d;--side:#1c1f25;--card:#1d2026;--line:#2b2f37;--text:#e9eaef;--muted:#8c919c;--amber:#f2b33d;--teal:#34c9a3;--orange:#F59E0B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--desk);font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
html.clear,html.clear body{background:transparent}
html.vert,html.vert body{width:1080px;height:1920px}
html.vert .callout{top:56px;padding:0 40px}
html.vert .callout span{font-size:46px;text-align:center;line-height:1.25;letter-spacing:.1em}
html.vert .side{display:none}
.win.vwin{left:6px;top:40px;width:708px;height:1180px}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.scene.on{display:block}

/* ---------- Noah window (recreated from the app screenshots) ---------- */
.stagebg{position:absolute;inset:0;background:radial-gradient(900px 600px at 82% 12%,rgba(139,92,246,.20),transparent 60%),radial-gradient(800px 520px at 10% 95%,rgba(217,119,6,.14),transparent 60%),radial-gradient(1200px 800px at 50% 50%,#121838 0%,#0B1024 70%)}
.cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.win{position:absolute;left:320px;top:60px;width:1280px;height:960px;border-radius:10px;overflow:hidden;background:var(--win);border:1px solid #2a2d35;box-shadow:0 40px 120px rgba(0,0,0,.6)}
.win.max{left:0;top:0;width:1920px;height:1080px;border-radius:0;border:0}
.title{height:34px;background:#15171b;display:flex;align-items:center;padding-left:12px;font-size:14px;color:#dfe1e6;gap:9px;border-bottom:1px solid #1f2227}
.title img{width:18px;height:18px}
.title .ctl{margin-left:auto;display:flex;height:100%}
.title .ctl span{width:52px;display:flex;align-items:center;justify-content:center;color:#cfd2d8}
.body{position:absolute;top:34px;left:0;right:0;bottom:0;display:flex}
.side{width:345px;background:var(--side);border-right:1px solid #24272e;position:relative;padding:14px 12px;flex:none}
.side .row{display:flex;align-items:center;gap:14px;padding:10px 12px;font-size:18px;color:#e6e7eb}
.side .row svg{width:18px;height:18px;stroke:#b8bcc6;fill:none;stroke-width:1.8}
.side .sep{height:1px;background:#2a2d35;margin:12px 8px 16px}
.side .hdr{font-size:13px;letter-spacing:.14em;color:#7d828d;font-weight:600;padding:8px 12px}
.side .item{padding:10px 12px;border-radius:10px;margin-bottom:6px}
.side .item .t{font-size:17.5px;color:#dcdee3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .item .d{font-size:12.5px;color:#737884;margin-top:4px}
.side .item.sel{background:#262a31}
.side .settings{position:absolute;left:12px;right:12px;bottom:0;border-top:1px solid #2a2d35;padding:18px 12px;display:flex;gap:12px;align-items:center;font-size:17px;color:#d7d9de}
.main{flex:1;position:relative;background:var(--win);overflow:hidden}
.scroll{position:absolute;left:0;right:0;top:0;padding:0 44px}
.composer{position:absolute;left:44px;right:44px;bottom:26px;height:66px;border-radius:14px;background:#1d2027;border:1px solid #33374a;box-shadow:0 0 0 1px rgba(99,102,241,.12),0 0 24px rgba(99,102,241,.08);display:flex;align-items:center;padding:0 12px 0 22px;font-size:19px;color:#80858f}
.composer .txt{flex:1;white-space:nowrap;overflow:hidden}
.composer .typed{color:#eceef2}
.caret{display:inline-block;width:2px;height:22px;background:#c7cbff;vertical-align:-4px;margin-left:1px}
.sendbtn{width:46px;height:46px;border-radius:11px;background:#262a33;display:flex;align-items:center;justify-content:center;flex:none}
.sendbtn.stop{background:#3b2427}.sendbtn.stop i{width:12px;height:12px;border-radius:2px;background:#f0625d;display:block}
.sendbtn.go{background:linear-gradient(135deg,#5b8def,#8b5cf6)}
.hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:14px;color:#6f7480}
.bubble{margin-left:auto;width:max-content;max-width:700px;background:#2a2e37;border-radius:18px;padding:16px 22px;font-size:20px;line-height:1.45;color:#eef0f3}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;position:relative;overflow:hidden}
.card .bar{position:absolute;left:0;top:0;height:3px;background:linear-gradient(90deg,#5b8def,#8b5cf6)}
.looking{display:flex;align-items:center;padding:0 24px;height:66px;gap:18px;font-weight:700;font-size:17px}
.dots{display:flex;gap:4px}.dots i{width:5px;height:5px;border-radius:50%;background:#7c80f0;display:block}
.did{height:48px;display:flex;align-items:center;padding:0 22px;gap:12px;font-size:15.5px;border-radius:12px;background:#1b1e24;border:1px solid var(--line)}
.did b{font-weight:700;color:#dadce2}.did .m{color:#7c818c}.did .sw{margin-left:auto;color:#8b909b;font-size:14.5px}
.check{width:18px;height:18px;border-radius:50%;background:rgba(52,201,163,.14);display:inline-flex;align-items:center;justify-content:center;flex:none}
.check svg{width:11px;height:11px;stroke:var(--teal);stroke-width:3;fill:none}
.sec{font-size:14px;letter-spacing:.14em;color:#7d828d;font-weight:600;margin:0 0 14px}
.sec:before{content:"— "}
.sit{font-size:22px;line-height:1.62;color:#e7e8ec;margin-bottom:26px}
.stats{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:30px}
.stat{flex:1;padding:18px 22px;border-right:1px solid var(--line);min-width:0}.stat:last-child{border-right:0}
.stat .k{font-size:13px;letter-spacing:.1em;color:#8a8f99;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-size:20px;font-weight:800;color:var(--amber);margin:8px 0}
.stat .v.ok{color:#eef0f3}.stat .v.good{color:var(--teal)}
.stat .s{font-size:13px;color:#737884;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps .st{display:flex;gap:18px;margin-bottom:22px}
.num{width:32px;height:32px;border-radius:50%;border:1.5px solid #3a3f6e;color:#8b8ff8;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.st .a{font-size:20px;font-weight:700;color:#eef0f3}.st .b{font-size:15.5px;color:#80858f;margin-top:4px}
.cta{height:56px;border-radius:12px;background:linear-gradient(90deg,#5b8def,#8b5cf6);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;color:#fff;box-shadow:0 10px 30px rgba(99,102,241,.35)}
.approved{border-left:2px solid #2d3038;padding:12px 0 12px 22px;font-size:20px;color:#e3e5ea}
.progress .p{display:flex;align-items:center;gap:14px;font-size:17px;font-weight:600;color:#d7d9de;padding:9px 0}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid #3a3f6e;border-top-color:#8b8ff8;flex:none}
.noahmeta{font-size:16px;color:#7c818c;margin:0 0 12px 26px}.noahmeta b{color:#8b8ff8;font-weight:700;font-size:18px;margin-right:8px}
.res .big{font-size:25px;font-weight:800;margin:4px 0 12px}
.shade{position:absolute;inset:34px 0 0 0;background:rgba(8,9,12,.5)}
.dlg{position:absolute;left:50%;top:50%;width:500px;margin-left:-250px;margin-top:-128px;border-radius:16px;background:#1f2228;border:1px solid #33363f;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.dlg .hd{display:flex;align-items:center;gap:16px;padding:26px 30px 10px}
.warn{width:50px;height:50px;border-radius:12px;background:#3a3222;display:flex;align-items:center;justify-content:center}
.warn svg{width:26px;height:26px;fill:none;stroke:#f2b33d;stroke-width:2}
.dlg .q{font-size:19px;font-weight:700}
.dlg .m{padding:14px 32px 24px;font-size:18px;color:#dfe1e6;border-bottom:1px solid #30333b}
.dlg .btns{display:flex;justify-content:flex-end;gap:10px;padding:20px 30px 22px}
.btn{height:46px;border-radius:9px;padding:0 20px;display:flex;align-items:center;font-size:17px;font-weight:500}
.btn.no{background:#2a2d34;color:#b6bac3}.btn.go{background:linear-gradient(135deg,#6f8df2,#8b5cf6);color:#fff}.btn.all{border:1.5px solid #3f45a0;color:#9da2ff}
.cursor{position:absolute;width:26px;height:36px;z-index:50;left:0;top:0}

/* ---------- ad callouts ---------- */
.callout{position:absolute;left:0;right:0;top:40px;display:flex;justify-content:center;pointer-events:none}
.callout span{font-weight:800;font-size:40px;letter-spacing:.16em;padding:12px 30px;border-radius:14px;color:#fff;background:rgba(11,16,36,.86);border:1px solid rgba(199,203,255,.25);box-shadow:0 10px 40px rgba(0,0,0,.4)}
.callout span b{color:#C7CBFF;font-weight:800}

/* ---------- generic PC desktop (problem screens) ---------- */
.pc{position:absolute;inset:0;background:radial-gradient(1400px 900px at 70% 20%,#23305e 0%,#141a36 45%,#0a0d1c 100%);overflow:hidden}
.pc .wall{position:absolute;inset:0;background:radial-gradient(600px 300px at 20% 80%,rgba(245,158,11,.10),transparent),radial-gradient(700px 400px at 85% 15%,rgba(139,92,246,.18),transparent)}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:56px;background:rgba(18,20,30,.92);border-top:1px solid #262a3a;display:flex;align-items:center;justify-content:center;gap:14px}
.taskbar i{display:block;width:34px;height:34px;border-radius:8px;background:#2a3050}
.taskbar .tray{position:absolute;right:22px;display:flex;gap:18px;align-items:center;color:#cfd3e0;font-size:15px}
.appwin{position:absolute;background:#1e2230;border:1px solid #333a50;border-radius:10px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55);color:#dfe3ee}
.appwin .tb{height:40px;background:#262b3b;border-bottom:1px solid #333a50;display:flex;align-items:center;padding-left:16px;font-size:15px;font-weight:600}
.appwin .content{position:absolute;top:40px;left:0;right:0;bottom:0;background:linear-gradient(135deg,#2a3150,#1a1f33)}
.hang{position:absolute;inset:0;background:rgba(235,238,245,.38)}
.sysdlg{position:absolute;width:560px;background:#1f2330;border:1px solid #384058;border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.6);padding:26px 28px;color:#e8eaf2}
.sysdlg h3{font-size:20px;font-weight:700;margin-bottom:10px}
.sysdlg p{font-size:16px;color:#aab0c2;line-height:1.5}
.sysdlg .bt{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.sysdlg .bt span{padding:10px 18px;border-radius:8px;background:#2c3246;font-size:15px}
.toast{position:absolute;right:30px;bottom:80px;width:520px;background:#1f2330;border:1px solid #4a3a1a;border-radius:14px;padding:22px 24px;display:flex;gap:18px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.meter{height:12px;border-radius:6px;background:#2c3246;overflow:hidden;margin-top:14px}.meter i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#ef4444)}
.flyout{position:absolute;right:30px;bottom:80px;width:420px;background:#1f2330;border:1px solid #384058;border-radius:14px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.bigspin{width:120px;height:120px;border-radius:50%;border:10px solid rgba(255,255,255,.15);border-top-color:#c7cbff}
.glitch{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 2px,transparent 2px 4px);opacity:.35}
.problem{position:absolute;left:0;right:0;top:58px;text-align:center;font-weight:800;font-size:118px;letter-spacing:.02em;color:#fff;text-shadow:0 8px 40px rgba(0,0,0,.6)}
.problem .rgb{position:absolute;left:0;right:0;top:0}

/* ---------- diagnostic visualisation ---------- */
#diag{background:radial-gradient(1200px 800px at 50% 50%,#150f33 0%,#07081a 75%)}
#diag canvas{position:absolute;inset:0}
.dlabel{position:absolute;font-size:22px;font-weight:700;letter-spacing:.2em;color:#c7cbff;opacity:.85}
.dbar{position:absolute;height:10px;border-radius:5px;background:rgba(199,203,255,.12);overflow:hidden}.dbar i{display:block;height:100%;background:linear-gradient(90deg,#8b5cf6,#f59e0b)}

/* ---------- overlays (transparent) ---------- */
.ovl{position:absolute;inset:0}
.headline{position:absolute;left:0;right:0;text-align:center;font-weight:800;color:#fff;letter-spacing:.03em;text-shadow:0 6px 30px rgba(0,0,0,.65)}
.warm{color:#ffd9a0;text-shadow:0 0 22px rgba(245,158,11,.75),0 0 60px rgba(245,158,11,.45),0 6px 30px rgba(0,0,0,.6)}
.meetcard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}

/* ---------- captions ---------- */
.capwrap{position:absolute;left:0;right:0;bottom:92px;display:flex;justify-content:center}
.cap{max-width:1380px;text-align:center;font-weight:700;font-size:44px;line-height:1.28;color:#fff;padding:12px 30px 14px;border-radius:14px;background:rgba(6,8,18,.72);text-wrap:balance}
.cap .hs{color:#F59E0B}.cap .hn{color:#A5A8FF}

/* ---------- splash ---------- */
#splash{background:radial-gradient(1100px 700px at 50% 45%,#141a44 0%,#0B1024 72%)}
.fog{position:absolute;left:-200px;right:-200px;bottom:-60px;height:340px;background:radial-gradient(ellipse at 30% 100%,rgba(199,203,255,.10),transparent 60%),radial-gradient(ellipse at 75% 100%,rgba(199,203,255,.08),transparent 60%)}
.edgeL{position:absolute;left:-160px;bottom:-200px;width:560px;height:560px;background:radial-gradient(closest-side,rgba(245,158,11,.20),transparent)}
.edgeR{position:absolute;right:-200px;top:-200px;width:700px;height:600px;background:radial-gradient(closest-side,rgba(139,92,246,.20),transparent)}
.brand{position:absolute;left:300px;top:236px;width:520px;display:flex;flex-direction:column;align-items:center}
.brand img{width:250px;height:250px}
.brand .wm{margin-top:34px;font-size:96px;font-weight:800;letter-spacing:.2em;padding-left:.2em;color:#fff}
.divider{position:absolute;left:900px;top:244px;width:1px;height:400px;background:linear-gradient(transparent,rgba(199,203,255,.35),transparent)}
.tag{position:absolute;left:990px;top:262px;font-weight:800;font-size:100px;line-height:1.1}
.tag div{white-space:nowrap}
.tag .d3{background:linear-gradient(90deg,#8b8ff8,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.ctaRow{position:absolute;left:0;right:0;top:768px;display:flex;justify-content:center;align-items:center;gap:40px}
.dl{height:84px;padding:0 48px;border-radius:18px;background:linear-gradient(90deg,#5b8def,#8b5cf6);display:flex;align-items:center;font-size:32px;font-weight:800;letter-spacing:.08em;color:#fff;box-shadow:0 16px 50px rgba(99,102,241,.35)}
.url{font-size:42px;font-weight:700;color:#e9eaef}
.particle{position:absolute;width:4px;height:4px;border-radius:50%;background:#c7cbff}
.black{position:absolute;inset:0;background:#000;pointer-events:none}
</style>
</head>
<body>

<template id="winTpl">
  <div class="win">
    <div class="title"><img src="../../brand-pack/svg/noah-appicon-dark.svg" alt="">Noah
      <div class="ctl"><span>&#x2013;</span><span>&#x25A1;</span><span>&#x2715;</span></div></div>
    <div class="body">
      <div class="side">
        <div class="row"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New chat
          <svg viewBox="0 0 24 24" style="margin-left:auto"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></div>
        <div class="row"><svg viewBox="0 0 24 24"><path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/></svg>Knowledge</div>
        <div class="sep"></div>
        <div class="today" style="display:none"><div class="hdr">TODAY</div>
          <div class="item sel"><div class="t">PC Lagging and Apps Freezing</div><div class="d">09:12 PM</div></div><div style="height:10px"></div></div>
        <div class="hdr">EARLIER</div>
        <div class="item"><div class="t">Battle.net Installation and Startup...</div><div class="d">Oct 27, 03:32 PM</div></div>
        <div class="item"><div class="t">System Information Details Requ...</div><div class="d">Oct 27, 03:19 PM</div></div>
        <div class="item"><div class="t">Computer Performance Analysis ...</div><div class="d">Oct 25, 08:04 PM</div></div>
        <div class="item"><div class="t">Checking System Updates</div><div class="d">Oct 25, 07:59 PM</div></div>
        <div class="item"><div class="t">Empty Recycle Bin</div><div class="d">Oct 25, 07:46 PM</div></div>
        <div class="item"><div class="t">Printer Status Check</div><div class="d">Oct 25, 03:11 PM</div></div>
        <div class="settings"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#b8bcc6" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/></svg>Settings</div>
      </div>
      <div class="main"><div class="scroll"></div>
        <div class="composer"><div class="txt"></div><div class="sendbtn"></div></div>
        <div class="hint" style="display:none">&#x1F5E8;&#xFE0E; You can always talk to Noah instead of clicking — change the plan, skip part, or ask a question.</div>
      </div>
    </div>
  </div>
</template>

<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="cursorS" viewBox="0 0 26 36"><path d="M2 2v27l7-6 5 11 5-2-5-11h9z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="batS" viewBox="0 0 46 20"><path d="M23 6c1-3 2-4 2-4s0 3 1 4c3-3 9-5 20-3-5 1-8 4-8 9-3-3-6-3-8-1-1-2-3-3-4-3s-3 1-4 3c-2-2-5-2-8 1 0-5-3-8-8-9 11-2 17 0 20 3 1-1 1-4 1-4s1 1 2 4z"/></symbol>
</defs></svg>

<div id="ui" class="scene"><div class="stagebg"></div><div class="cam" id="cam"></div><div id="callout" class="callout"></div><div class="black" id="uiblack" style="opacity:0"></div></div>
<div id="pcScene" class="scene"><div class="pc"><div class="wall"></div><div id="pcContent"></div>
  <div class="taskbar"><i></i><i></i><i></i><i></i><i></i><div class="tray" id="tray"></div></div></div>
  <div id="pcFx"></div><div class="scan" id="scan"></div><div id="problem"></div></div>
<div id="diag" class="scene"><canvas id="dc" width="1920" height="1080"></canvas><div id="dlabels"></div><div class="black" id="dflash" style="background:#fff;opacity:0"></div></div>
<div id="ovScene" class="scene"><div class="ovl" id="ovl"></div></div>
<div id="vsplash" class="scene" style="background:radial-gradient(900px 1100px at 50% 40%,#151b46 0%,#0B1024 72%)">
  <div style="position:absolute;left:-200px;bottom:-200px;width:700px;height:640px;background:radial-gradient(closest-side,rgba(245,158,11,.20),transparent)"></div>
  <div style="position:absolute;right:-240px;top:-200px;width:760px;height:700px;background:radial-gradient(closest-side,rgba(139,92,246,.22),transparent)"></div>
  <div class="vparts"></div>
  <div class="fog" style="bottom:-40px;height:420px"></div>
  <div class="vbrand" style="position:absolute;left:0;right:0;top:250px;display:flex;flex-direction:column;align-items:center">
    <img src="../../brand-pack/svg/noah-appicon-dark.svg" style="width:260px;height:260px" alt="Noah">
    <div style="margin-top:34px;font-size:104px;font-weight:800;letter-spacing:.2em;padding-left:.2em;color:#fff">NOAH</div></div>
  <div style="position:absolute;left:0;right:0;top:790px;text-align:center;font-weight:800;font-size:112px;line-height:1.12">
    <div class="v1">DESCRIBE IT.</div><div class="v2">APPROVE IT.</div>
    <div class="v3" style="background:linear-gradient(90deg,#8b8ff8,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent">DONE.</div></div>
  <div class="vcta" style="position:absolute;left:0;right:0;top:1270px;display:flex;flex-direction:column;align-items:center;gap:34px">

  for(let r=0;r<6;r++){const rad=120+r*95, a0=t*(0.4+r*0.13)*(r%2?-1:1);
    c.strokeStyle=`rgba(${r%2?'199,203,255':'139,92,246'},${0.25+0.1*Math.sin(t*3+r)})`;c.lineWidth=2;
    c.setLineDash([12+r*6,18+r*4]);c.beginPath();c.arc(cx,cy,rad,a0,a0+Math.PI*1.6);c.stroke();}
  c.setLineDash([]);
  for(let i=0;i<220;i++){const ang=rnd(i)*Math.PI*2+t*(0.2+rnd(i*3)*0.6), rr=(rnd(i*5)*640+t*140*rnd(i*9))%640+40;
    const x=cx+Math.cos(ang)*rr*1.5, y=cy+Math.sin(ang)*rr*.8;c.fillStyle=`rgba(${rnd(i*7)>.8?'245,158,11':'199,203,255'},${0.3+0.6*rnd(i*11)})`;c.fillRect(x,y,2.2,2.2);}
  // scanning sweep
  const sw=t*1.6;c.fillStyle='rgba(139,92,246,.10)';c.beginPath();c.moveTo(cx,cy);c.arc(cx,cy,720,sw,sw+.35);c.closePath();c.fill();
  // lines from centre to each label
  LBL.forEach(([n,x,y],i)=>{const k=seg(t,.3+i*.35,.7+i*.35);if(k<=0)return;c.strokeStyle=`rgba(199,203,255,${.35*k})`;c.lineWidth=1.5;c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+(x+120-cx)*k,cy+(y+14-cy)*k);c.stroke();});
  $('#dlabels').innerHTML=LBL.map(([n,x,y],i)=>{const k=eo(seg(t,.3+i*.35,.7+i*.35));const flick=t<3.2&&rnd(Math.floor(t*20)+i)>.85?.35:1;
    return `<div class="dlabel" style="left:${x}px;top:${y}px;opacity:${k*flick}">${n}</div><div class="dbar" style="left:${x}px;top:${y+40}px;width:260px;opacity:${k}"><i style="width:${30+60*Math.abs(Math.sin(t*1.7+i*1.3))}%"></i></div>`;}).join('')
    +`<div style="position:absolute;left:${cx-60}px;top:${cy-60}px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(199,203,255,.9),rgba(139,92,246,.35) 45%,transparent 70%);transform:scale(${1+.08*Math.sin(t*5)})"></div>`
    +`<div class="glitch">${glitchFx(t,t<.4?.6:(rnd(Math.floor(t*8))>.8?.3:0),91)}</div>`;
  $('#dflash').style.opacity=Math.max(0,1-t/0.35)*0.85;}

/* ======================= overlays (rendered with transparent background) ======================= */
function ovTreats(t){ // t=0 at video start; "treats" is sung at 4.36 s, "tricks" at 5.12 s
  const a=eo(seg(t,4.25,4.55)), b=seg(t,5.05,5.15), gl=t>5.05&&t<5.45;
  const j=gl?(rnd(Math.floor(t*30))-.5)*30:0;
  return `<div class="headline warm" style="top:150px;font-size:120px;opacity:${a};transform:scale(${lerp(1.06,1,a)})">MORE TREATS.</div>
   <div class="headline" style="top:290px;font-size:120px;opacity:${b}">
     ${gl?`<div style="position:absolute;left:0;right:0;color:rgba(245,158,11,.8);transform:translateX(${j+8}px)">LESS TRICKS.</div><div style="position:absolute;left:0;right:0;color:rgba(99,102,241,.8);transform:translateX(${-j-8}px)">LESS TRICKS.</div>`:''}
     <div style="position:relative;transform:translateX(${j}px);clip-path:${gl?`inset(${rnd(Math.floor(t*30))*40}% 0 ${rnd(Math.floor(t*31))*30}% 0)`:'none'}">LESS TRICKS.</div></div>`;}
function ovNightmare(t){ // t=0 at "nightmare"
  const k=seg(t,0,.08), s=lerp(1.35,1,eo(seg(t,0,.3))), sh=t<.3?(rnd(Math.floor(t*40))-.5)*18:0;
  return `<div class="headline" style="top:360px;font-size:150px;letter-spacing:.06em;opacity:${k};transform:translateX(${sh}px) scale(${s});color:#fff;text-shadow:0 0 30px rgba(245,158,11,.6),0 10px 50px rgba(0,0,0,.8)">NIGHTMARE FUEL</div>`;}
function ovText(txt,t,size,top){const k=eo(seg(t,0,.18));return `<div style="position:absolute;left:0;right:0;top:0;height:${top+size*1.9}px;background:linear-gradient(rgba(6,8,18,.85),rgba(6,8,18,.55) 70%,transparent);opacity:${k}"></div><div class="headline" style="top:${top}px;font-size:${size}px;opacity:${k};transform:translateY(${(1-k)*14}px)">${txt}</div>`;}
function ovMeet(t){const k=eo(seg(t,0,.45)), k2=eo(seg(t,.35,.8));
  return `<div style="position:absolute;inset:0;background:radial-gradient(900px 600px at 50% 45%,rgba(11,16,36,.72),rgba(11,16,36,.25) 70%,transparent);opacity:${k}"></div>
   <div class="meetcard" style="opacity:${k}"><img src="${ICON}" style="width:190px;height:190px;transform:scale(${lerp(.9,1,k)})">
   <div style="margin-top:30px;font-size:96px;font-weight:800;letter-spacing:.12em;color:#fff">MEET NOAH</div>
   <div style="margin-top:10px;font-size:40px;font-weight:600;color:#C7CBFF;opacity:${k2}">Find the real cause.</div></div>`;}
function ovHaunt(t){const k=eo(seg(t,.1,.45)), k2=eo(seg(t,.9,1.25));
  return `<div class="headline" style="top:120px;font-size:84px;opacity:${k}">DON'T LET BAD SOFTWARE</div>
          <div class="headline warm" style="top:220px;font-size:84px;opacity:${k2}">HAUNT YOUR PC.</div>`;}
const OVERLAYS={treats:ovTreats,nightmare:ovNightmare,meet:ovMeet,haunt:ovHaunt,
  nojump:t=>ovText('NO JUMP SCARES.',t,110,150),nomystery:t=>ovText('NO MYSTERY FIXES.',t,96,70),nosurprise:t=>ovText('NO SCARY SURPRISES.',t,96,70)};

/* ======================= splash ======================= */
function splash(t,cue){ // cue: seconds (relative) when Describe / Approve / Done are spoken
  $('#sfade').style.opacity=1-seg(t,0,.5);
  const b=eo(seg(t,.1,.8));$('#brand').style.opacity=b;$('#brand').style.transform=`translateY(${(1-b)*20}px)`;
  $('#divider').style.opacity=eo(seg(t,.5,1.1));
  const c=eo(seg(t,.35,.9));$('#ctaRow').style.opacity=c;$('#ctaRow').style.transform=`translateY(${(1-c)*16}px)`;
  [['.d1',cue[0]],['.d2',cue[1]],['.d3',cue[2]]].forEach(([s,a])=>{const e=$('#tag '+s),k=eo(seg(t,a-.08,a+.3));e.style.opacity=k;e.style.transform=`translateX(${(1-k)*30}px)`;});
  $('#fog').style.transform=`translateX(${Math.sin(t*.4)*60}px)`;
  $('#parts').innerHTML=Array.from({length:40},(_,i)=>{const x=(rnd(i)*1920+t*(10+rnd(i*3)*20))%1920,y=1080-((rnd(i*5)*1080+t*(14+rnd(i*7)*26))%1080);
    return `<div class="particle" style="left:${x}px;top:${y}px;opacity:${.12+.3*rnd(i*9)};transform:scale(${.6+rnd(i*11)})"></div>`}).join('');}

/* ======================= vertical (Shorts) additions ======================= */
/* One continuous Noah take for the Short: describe -> checks -> cause -> plan -> approval -> log.
   t in seconds from the start of the take. Camera moves are eased; nothing cuts. */
function fcam(pts,t){ // pts: [[t,s,fy,cy],...] -> eased interpolation
  let i=0; while(i<pts.length-1&&t>pts[i+1][0]) i++;
  const a=pts[i],b=pts[Math.min(i+1,pts.length-1)]; const k=b[0]>a[0]?ease(seg(t,a[0],b[0])):1;
  return [lerp(a[1],b[1],k),lerp(a[2],b[2],k),lerp(a[3],b[3],k)];}
function rel(el){const r=el.getBoundingClientRect(),w=W.win.getBoundingClientRect(),sc=w.width/W.win.offsetWidth;
  return [(r.left-w.left+r.width/2)/sc,(r.top-w.top+r.height/2)/sc];}
function flow(t){
  resetWin(false);
  const TYPE_END=0.34, SENT=0.38, CHECKS=0.45, CAUSE=0.95, PLAN=1.95, CLICK_CTA=3.05, DLG=3.2, GO=4.7, LOG=4.95;
  // --- composer / bubble / checks / situation / log ---
  if(t<SENT){const n=Math.floor(PROMPT.length*seg(t,0,TYPE_END));
    W.txt.innerHTML=`<span class="typed">${PROMPT.slice(0,n)}</span><span class="caret"></span>`;
    W.send.className='sendbtn'+(n==PROMPT.length?' go':'');W.send.innerHTML=ARROW(n==PROMPT.length?'#fff':'#6f7480');
    W.today.style.display='none';W.scroll.innerHTML='';}
  else if(t<CAUSE){W.send.className='sendbtn stop';W.send.innerHTML='<i></i>';
    const b=eo(seg(t,SENT,SENT+.15));
    const list=['Checking performance…','Checking active processes…','Checking memory…','Checking storage…','Checking system configuration…'].map((c,i)=>{
      const on=t>=CHECKS+i*.09, done=t>=CHECKS+(i+1)*.09;
      return `<div class="p" style="opacity:${on?1:.3}">${done?CHK:(on?SPIN(t):'<span class="spinner" style="opacity:.4"></span>')}${done?c.replace('Checking','Checked').replace('…',''):c}</div>`;}).join('');
    W.scroll.innerHTML=`<div style="height:30px"></div>${userBubble(b)}<div style="height:30px"></div>
      <div class="card progress" style="padding:18px 26px 14px;opacity:${eo(seg(t,SENT+.05,SENT+.15))}"><div class="bar" style="width:${100*((t*1.2)%1)}%"></div>
      <div class="looking" style="height:auto;padding:0 0 10px 0">${dots(t)}<span>Looking into it…</span></div>${list}</div>`;}
  else if(t<LOG){
    W.hint.style.display='block';W.txt.innerHTML=t<DLG?'...or tell Noah to do it differently':"What's broken? Tell Noah and hit go.";
    if(t>=DLG){W.send.className='sendbtn stop';W.send.innerHTML='<i></i>';} else W.send.innerHTML=ARROW('#8c919c');
    W.scroll.innerHTML='<div style="height:22px"></div>'+situationCard(t);
    W.scroll.querySelectorAll('.rv').forEach(e=>{const k=+e.dataset.k;const a=eo(seg(t,CAUSE+k*.1,CAUSE+.3+k*.1));e.style.opacity=a;e.style.transform=`translateY(${(1-a)*16}px)`;});
    const cta=W.scroll.querySelector('#ctaBtn'); if(cta&&t>2.75&&t<DLG) cta.style.filter=`brightness(${1.12})`;
    if(cta&&t>=CLICK_CTA&&t<CLICK_CTA+.12) cta.style.transform='scale(.97)';}
  else{
    W.send.className='sendbtn stop';W.send.innerHTML='<i></i>';
    const p1=t>LOG+.3,p2=t>LOG+.6;
    W.scroll.innerHTML=`<div style="height:22px"></div><div class="approved" style="opacity:${eo(seg(t,LOG,LOG+.2))}">Approved: Action approved</div>
      <div class="card progress" style="padding:16px 26px;margin-top:22px;opacity:${eo(seg(t,LOG+.05,LOG+.25))}"><div class="bar" style="width:${Math.min(100,(t-LOG)*120)}%"></div>
      <div class="p">${p1?CHK:SPIN(t)}Stopping a stuck process — app updater</div>
      <div class="p" style="opacity:${p1?1:.35}">${p2?CHK:SPIN(t)}Turning off a startup program — app updater</div></div>`;}
  // --- approval dialog ---
  const d=eo(seg(t,DLG,DLG+.22))*(1-eo(seg(t,GO+.12,GO+.3)));
  if(d>0){W.body.style.filter=`blur(${5*d}px) brightness(${1-0.35*d})`;
    const press=t>=GO&&t<GO+.12;
    overlay.innerHTML=`<div class="dlg" style="opacity:${d};transform:scale(${lerp(.94,1,d)})">
      <div class="hd"><div class="warn"><svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg></div><div class="q">Can Noah do this?</div></div>
      <div class="m">Noah needs your OK to continue.</div>
      <div class="btns"><div class="btn no">No thanks</div>
        <div class="btn go" style="transform:scale(${press?.95:1});box-shadow:${t>4.2?'0 0 0 3px rgba(139,143,248,.35),0 8px 26px rgba(99,102,241,.45)':'none'}">Go ahead</div>
        <div class="btn all">Approve all</div></div></div>`;}
  // --- camera: full view -> cause -> plan -> dialog zoom -> log ---
  const [cs,cfy,ccy]=fcam([[0,1.5,590,1060],[CAUSE,1.5,590,1060],[PLAN,1.5,590,1060],[PLAN+.55,1.5,700,1010],[DLG,1.5,700,1010],[DLG+.45,1.95,590,1000],[GO+.15,1.95,590,1000],[LOG+.25,1.5,590,1060],[9,1.5,590,1060]],t);
  camera(cs,354,cfy,ccy);
  // --- cursor: to CTA, click, then to Go ahead, click ---
  if(t>=2.4&&t<LOG+.1){
    let x,y;
    const cta=W.scroll.querySelector('#ctaBtn'), go=overlay.querySelector('.btn.go');
    const [cx,cy]=cta?rel(cta):[354,900];
    if(t<DLG){const m=ease(seg(t,2.4,CLICK_CTA-.05));x=lerp(560,cx+40,m);y=lerp(1100,cy+6,m);}
    else{const [gx,gy]=go?rel(go):[380,654];const m=ease(seg(t,DLG+.45,GO-.15));x=lerp(cx+40,gx+8,m);y=lerp(cy+6,gy+8,m);}
    cur(x,y,(t>=CLICK_CTA&&t<CLICK_CTA+.12)||(t>=GO&&t<GO+.12));}
  // --- callout morphs in place ---
  const lab=t<CAUSE?'':t<PLAN?'CAUSE <b>FOUND</b>':t<DLG?'RECOMMENDED <b>ACTION</b>':t<LOG?'YOU <b>APPROVE</b> THE FIX.':'';
  const kin=t<CAUSE?0:eo(seg(t,[CAUSE,PLAN,DLG][t<PLAN?0:t<DLG?1:2],[CAUSE,PLAN,DLG][t<PLAN?0:t<DLG?1:2]+.18));
  callout(lab,t>=LOG?0:kin);
}
function ovBand(t,o){ // o: {lines:[[text,warm]],size,y,t0,t1}
  const k=eo(seg(t,o.t0||0,(o.t0||0)+.18))*(1-seg(t,o.t1||99,(o.t1||99)+.15));
  const h=o.lines.length*o.size*1.12+70;
  return `<div style="position:absolute;left:0;right:0;top:${o.y-h/2}px;height:${h}px;background:linear-gradient(transparent,rgba(6,8,18,.82) 22%,rgba(6,8,18,.82) 78%,transparent);opacity:${k}"></div>`+
    o.lines.map(([txt,warm,dl],i)=>{const kk=k*eo(seg(t,(o.t0||0)+(dl||0),(o.t0||0)+(dl||0)+.14)),sc=dl?lerp(1.18,1,kk):1;return `<div class="headline${warm?' warm':''}" style="top:${o.y-h/2+35+i*o.size*1.12}px;font-size:${o.size}px;line-height:1.05;opacity:${kk};transform:translateY(${(1-kk)*14}px) scale(${sc})">${txt}</div>`}).join('');}
OVERLAYS.band=ovBand;
function vsplash(t,cue){
  const el=$('#vsplash');
  el.querySelector('.vfade').style.opacity=window.NOFADE?0:1-seg(t,0,.35);
  const b=eo(seg(t,.05,.5));const br=el.querySelector('.vbrand');br.style.opacity=b;br.style.transform=`translateY(${(1-b)*20}px)`;
  const c=eo(seg(t,.2,.6));const cr=el.querySelector('.vcta');cr.style.opacity=c;cr.style.transform=`translateY(${(1-c)*16}px)`;
  ['.v1','.v2','.v3'].forEach((q,i)=>{const e=el.querySelector(q),k=eo(seg(t,cue[i]-.06,cue[i]+.22));e.style.opacity=k;e.style.transform=`scale(${lerp(1.08,1,k)})`;});
  el.querySelector('.vparts').innerHTML=Array.from({length:34},(_,i)=>{const x=(rnd(i)*1080+t*(10+rnd(i*3)*20))%1080,y=1920-((rnd(i*5)*1920+t*(20+rnd(i*7)*30))%1920);
    return `<div class="particle" style="left:${x}px;top:${y}px;opacity:${.12+.3*rnd(i*9)}"></div>`}).join('');}

/* ======================= dispatch ======================= */
const UI={s01,s02,s03,s04,s05,s06,s07,flow};
const PC={freeze:pcFreeze,crash:pcCrash,wifi:pcWifi,loading:pcLoading,storage:pcStorage,lag:pcLag,haunt:pcHaunt};
function show(id){document.querySelectorAll('.scene').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');}
window.render=function(name,t,opt={}){
  const vert=!!opt.vert;document.documentElement.classList.toggle('vert',vert);CX=vert?540:960;
  window.PRESS_AT=opt.pressAt; if(opt.speed) t*=opt.speed;
  _render(name,t,opt);
  if(opt.vcam&&UI[name]) camera(opt.vcam.s,opt.vcam.fx||812,opt.vcam.fy,opt.vcam.cy);
  if(opt.noLabel) $('#problem').innerHTML='';
};
function _render(name,t,opt){
  document.documentElement.classList.toggle('clear',name.startsWith('ov:')||name==='cap');
  if(UI[name]){show('#ui');UI[name](t,!!opt.max);return;}
  if(name==='mon:launch'){show('#ui');sLaunch(t);return;}
  if(name.startsWith('mon:')){show('#ui');UI[name.slice(4)](t,true);return;}
  if(PC[name]){show('#pcScene');PC[name](t);return;}
  if(name==='diag'){show('#diag');diag(t);return;}
  if(name==='splash'){show('#splash');splash(t,opt.cue||[3,4,5]);return;}
  if(name==='vsplash'){window.NOFADE=!!opt.noFade;show('#vsplash');vsplash(t,opt.cue||[1,1.5,2]);return;}
  if(name.startsWith('ov:')){show('#ovScene');$('#ovl').innerHTML=OVERLAYS[name.slice(3)](t,opt);return;}
}
window.caption=function(html){document.documentElement.classList.add('clear');show('#capScene');$('#capText').innerHTML=html;};
const q=new URLSearchParams(location.search);if(q.get('s'))render(q.get('s'),+(q.get('t')||0),{max:q.get('max')==='1'});
</script>
