<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Noah Halloween Stage</title>
<style>
@font-face{font-family:'Plus Jakarta Sans';font-weight:400;font-display:block;src:url(fonts/plus-jakarta-sans-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-weight:500;font-display:block;src:url(fonts/plus-jakarta-sans-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-weight:600;font-display:block;src:url(fonts/plus-jakarta-sans-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-weight:700;font-display:block;src:url(fonts/plus-jakarta-sans-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-weight:800;font-display:block;src:url(fonts/plus-jakarta-sans-latin-800-normal.woff2) format('woff2')}

  :root{
    --desk:#0B1024; --navy:#1A1D61; --indigo:#6366F1; --violet:#8B5CF6; --blue:#5B8DEF;
    --win:#16181d; --side:#1c1f25; --card:#1d2026; --card2:#22252c; --line:#2b2f37;
    --text:#e9eaef; --muted:#8c919c; --dim:#6b707b; --amber:#f2b33d; --teal:#34c9a3; --lav:#C7CBFF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden;background:var(--desk);
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
  body.cap{background:transparent}
  .scene{position:absolute;inset:0;display:none;overflow:hidden}
  .scene.on{display:block}

  /* ---------- desktop backdrop ---------- */
  .desktop{position:absolute;inset:0;background:
      radial-gradient(900px 600px at 82% 12%, rgba(139,92,246,.22), transparent 60%),
      radial-gradient(800px 520px at 10% 95%, rgba(217,119,6,.16), transparent 60%),
      radial-gradient(1200px 800px at 50% 50%, #121838 0%, #0B1024 70%);}
  .moon{position:absolute;right:170px;top:70px;width:120px;height:120px;border-radius:50%;
      background:radial-gradient(circle at 40% 38%, #f4f0e6 0%, #d9d3c3 55%, #b9b19c 100%);opacity:.22;filter:blur(.5px)}
  .bat{position:absolute;width:46px;height:20px;opacity:.35}
  .bat path{fill:#05070f}
  .vignette{position:absolute;inset:0;pointer-events:none;
      background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%)}

  /* ---------- camera + window ---------- */
  .cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;will-change:transform}
  .win{position:absolute;left:320px;top:60px;width:1280px;height:960px;border-radius:10px;overflow:hidden;
      background:var(--win);border:1px solid #2a2d35;box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03)}
  .title{height:34px;background:#15171b;display:flex;align-items:center;padding-left:12px;font-size:14px;color:#dfe1e6;gap:9px;border-bottom:1px solid #1f2227}
  .title img{width:18px;height:18px;border-radius:5px}
  .title .ctl{margin-left:auto;display:flex;height:100%}
  .title .ctl span{width:52px;display:flex;align-items:center;justify-content:center;color:#cfd2d8}
  .body{position:absolute;top:34px;left:0;right:0;bottom:0;display:flex}
  .side{width:345px;background:var(--side);border-right:1px solid #24272e;position:relative;padding:14px 12px}
  .side .row{display:flex;align-items:center;gap:14px;padding:10px 12px;font-size:18px;color:#e6e7eb}
  .side .row svg{width:18px;height:18px;stroke:#b8bcc6;fill:none;stroke-width:1.8}
  .side .sep{height:1px;background:#2a2d35;margin:12px 8px 16px}
  .side .hdr{font-size:13px;letter-spacing:.14em;color:#7d828d;font-weight:600;padding:8px 12px}
  .side .item{padding:10px 12px;border-radius:10px;margin-bottom:6px}
  .side .item .t{font-size:17.5px;color:#dcdee3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .side .item .d{font-size:12.5px;color:#737884;margin-top:4px}
  .side .item.sel{background:#262a31}
  .side .settings{position:absolute;left:12px;right:12px;bottom:0;border-top:1px solid #2a2d35;padding:18px 12px;display:flex;gap:12px;align-items:center;font-size:17px;color:#d7d9de}
  .main{flex:1;position:relative;background:var(--win);overflow:hidden}
  .scroll{position:absolute;left:0;right:0;top:0;padding:0 44px 0 44px;will-change:transform}
  .composer{position:absolute;left:44px;right:44px;bottom:26px;height:66px;border-radius:14px;background:#1d2027;
      border:1px solid #33374a;box-shadow:0 0 0 1px rgba(99,102,241,.12),0 0 24px rgba(99,102,241,.08);display:flex;align-items:center;padding:0 12px 0 22px;font-size:19px;color:#80858f}
  .composer .txt{flex:1;white-space:nowrap}
  .composer .typed{color:#eceef2}
  .caret{display:inline-block;width:2px;height:22px;background:#c7cbff;vertical-align:-4px;margin-left:1px}
  .sendbtn{width:46px;height:46px;border-radius:11px;background:#262a33;display:flex;align-items:center;justify-content:center}
  .sendbtn.stop{background:#3b2427}
  .sendbtn.stop i{width:12px;height:12px;border-radius:2px;background:#f0625d;display:block}
  .sendbtn.go{background:linear-gradient(135deg,#5b8def,#8b5cf6)}
  .hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:14px;color:#6f7480}

  .bubble{margin-left:auto;width:max-content;max-width:640px;background:#2a2e37;border-radius:18px;padding:16px 22px;font-size:20px;color:#eef0f3}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;position:relative;overflow:hidden}
  .card .bar{position:absolute;left:0;top:0;height:3px;background:linear-gradient(90deg,#5b8def,#8b5cf6)}
  .looking{height:66px;display:flex;align-items:center;padding:0 24px;gap:18px;font-weight:700;font-size:17px}
  .dots{display:flex;gap:4px}
  .dots i{width:5px;height:5px;border-radius:50%;background:#7c80f0;display:block}
  .did{height:48px;display:flex;align-items:center;padding:0 22px;gap:12px;font-size:15.5px;border-radius:12px;background:#1b1e24;border:1px solid var(--line)}
  .did b{font-weight:700;color:#dadce2}
  .did .m{color:#7c818c}
  .did .sw{margin-left:auto;color:#8b909b;font-size:14.5px}
  .check{width:18px;height:18px;border-radius:50%;background:rgba(52,201,163,.14);display:flex;align-items:center;justify-content:center}
  .check svg{width:11px;height:11px;stroke:var(--teal);stroke-width:3;fill:none}
  .sec{font-size:14px;letter-spacing:.14em;color:#7d828d;font-weight:600;margin:0 0 14px}
  .sec:before{content:"— "}
  .sit{font-size:22px;line-height:1.62;color:#e7e8ec;margin-bottom:26px}
  .stats{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:30px}
  .stat{flex:1;padding:18px 22px;border-right:1px solid var(--line);min-width:0}
  .stat:last-child{border-right:0}
  .stat .k{font-size:13px;letter-spacing:.1em;color:#8a8f99;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat .v{font-size:19px;font-weight:800;color:var(--amber);margin:8px 0 8px}
  .stat .s{font-size:13px;color:#737884;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .steps .st{display:flex;gap:18px;margin-bottom:22px}
  .num{width:32px;height:32px;border-radius:50%;border:1.5px solid #3a3f6e;color:#8b8ff8;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
  .st .a{font-size:20px;font-weight:700;color:#eef0f3}
  .st .b{font-size:15.5px;color:#80858f;margin-top:4px}
  .cta{height:56px;border-radius:12px;background:linear-gradient(90deg,#5b8def,#8b5cf6);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;color:#fff;box-shadow:0 10px 30px rgba(99,102,241,.35)}
  .res .big{font-size:25px;font-weight:800;margin:4px 0 12px}
  .res .v{font-size:36px}
  .noahmeta{font-size:16px;color:#7c818c;margin:0 0 12px 26px}
  .noahmeta b{color:#8b8ff8;font-weight:700;font-size:18px;margin-right:8px}
  .approved{border-left:2px solid #2d3038;padding:12px 0 12px 22px;font-size:20px;color:#e3e5ea}
  .progress .p{display:flex;align-items:center;gap:14px;font-size:16px;font-weight:600;color:#d7d9de;padding:8px 0}
  .spinner{width:16px;height:16px;border-radius:50%;border:2px solid #3a3f6e;border-top-color:#8b8ff8}

  /* approval dialog */
  .shade{position:absolute;inset:34px 0 0 0;background:rgba(8,9,12,.55)}
  .dlg{position:absolute;left:50%;top:50%;width:500px;margin-left:-250px;margin-top:-128px;border-radius:16px;background:#1f2228;border:1px solid #33363f;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .dlg .hd{display:flex;align-items:center;gap:16px;padding:26px 30px 10px}
  .warn{width:50px;height:50px;border-radius:12px;background:#3a3222;display:flex;align-items:center;justify-content:center}
  .warn svg{width:26px;height:26px;fill:none;stroke:#f2b33d;stroke-width:2}
  .dlg .q{font-size:19px;font-weight:700}
  .dlg .m{padding:14px 32px 24px;font-size:18px;color:#dfe1e6;border-bottom:1px solid #30333b}
  .dlg .btns{display:flex;justify-content:flex-end;gap:10px;padding:20px 30px 22px}
  .btn{height:46px;border-radius:9px;padding:0 20px;display:flex;align-items:center;font-size:17px;font-weight:500}
  .btn.no{background:#2a2d34;color:#b6bac3}
  .btn.go{background:linear-gradient(135deg,#6f8df2,#8b5cf6);color:#fff}
  .btn.all{border:1.5px solid #3f45a0;color:#9da2ff}
  .cursor{position:absolute;width:26px;height:36px;z-index:50}

  /* ---------- captions ---------- */
  .capwrap{position:absolute;left:0;right:0;bottom:118px;display:flex;justify-content:center}
  .cap{max-width:1500px;text-align:center;font-weight:700;font-size:46px;line-height:1.25;color:#fff;
      padding:14px 34px 16px;border-radius:16px;background:rgba(8,10,22,.62);
      text-shadow:0 2px 12px rgba(0,0,0,.5);letter-spacing:-.005em;text-wrap:balance}
  .cap.ui{font-weight:800;background:rgba(11,16,36,.82);border:1px solid rgba(199,203,255,.18)}
  .cap em{font-style:normal;color:#c7cbff}

  /* ---------- splash ---------- */
  #splash{background:radial-gradient(1100px 700px at 50% 45%, #141a44 0%, #0B1024 72%)}
  .fog{position:absolute;left:-200px;right:-200px;bottom:-60px;height:340px;
      background:radial-gradient(ellipse at 30% 100%, rgba(199,203,255,.10), transparent 60%),radial-gradient(ellipse at 75% 100%, rgba(199,203,255,.08), transparent 60%)}
  .glowL{position:absolute;left:-120px;bottom:-160px;width:620px;height:520px;background:radial-gradient(closest-side, rgba(217,119,6,.28), transparent)}
  .glowR{position:absolute;right:-160px;top:-160px;width:700px;height:560px;background:radial-gradient(closest-side, rgba(139,92,246,.22), transparent)}
  .brand{position:absolute;left:300px;top:300px;width:520px;display:flex;flex-direction:column;align-items:center}
  .brand img{width:250px;height:250px}
  .brand .wm{margin-top:34px;font-size:96px;font-weight:800;letter-spacing:.2em;padding-left:.2em;color:#fff}
  .divider{position:absolute;left:900px;top:300px;width:1px;height:400px;background:linear-gradient(transparent,rgba(199,203,255,.35),transparent)}
  .tag{position:absolute;left:990px;top:318px;font-weight:800;font-size:100px;line-height:1.1;letter-spacing:-.01em}
  .tag div{white-space:nowrap}
  .tag .d3{background:linear-gradient(90deg,#8b8ff8,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
  .ctaRow{position:absolute;left:0;right:0;top:830px;display:flex;justify-content:center;align-items:center;gap:40px}
  .dl{height:84px;padding:0 48px;border-radius:18px;background:linear-gradient(90deg,#5b8def,#8b5cf6);display:flex;align-items:center;font-size:32px;font-weight:800;letter-spacing:.08em;color:#fff;box-shadow:0 16px 50px rgba(99,102,241,.35)}
  .url{font-size:42px;font-weight:700;color:#e9eaef;letter-spacing:.01em}
  .fadeblack{position:absolute;inset:0;background:#000;pointer-events:none}
</style>
</head>
<body>

<!-- shared window template is cloned by JS -->

      <div class="ctl"><span>&#x2013;</span><span>&#x25A1;</span><span>&#x2715;</span></div></div>
    <div class="body">

        <div class="row"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New chat

      <div class="main"><div class="scroll"></div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="batS" viewBox="0 0 46 20"><path d="M23 6c1-3 2-4 2-4s0 3 1 4c3-3 9-5 20-3-5 1-8 4-8 9-3-3-6-3-8-1-1-2-3-3-4-3s-3 1-4 3c-2-2-5-2-8 1 0-5-3-8-8-9 11-2 17 0 20 3 1-1 1-4 1-4s1 1 2 4z"/></symbol>
    <symbol id="cursorS" viewBox="0 0 26 36"><path d="M2 2v27l7-6 5 11 5-2-5-11h9z" fill="#fff" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<div id="ui" class="scene">
  <div class="desktop"></div>
  <div class="moon"></div>
  <div id="bats"></div>
  <div class="cam" id="cam"></div>
  <div class="vignette" style="opacity:.6"></div>
  <div class="fadeblack" id="uifade" style="opacity:0"></div>
</div>

<div id="splash" class="scene">
  <div class="glowL"></div><div class="glowR"></div>
  <div class="moon" style="right:230px;top:90px;opacity:.14"></div>
  <div id="sbats"></div>
  <div class="fog" id="fog"></div>
  <div class="brand" id="brand"><img src="../brand-pack/svg/noah-appicon-dark.svg" alt="Noah"><div class="wm">NOAH</div></div>

</div>

<div id="capScene" class="scene"><div class="capwrap"><div class="cap" id="capText"></div></div></div>

<script>
const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const eo=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,k)=>a+(b-a)*k;

/* bats drifting */
function batsInto(el,n,seed){el.innerHTML='';for(let i=0;i<n;i++){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','bat');s.setAttribute('viewBox','0 0 46 20');s.innerHTML='<use href="#batS"/>';s.dataset.i=i+seed;el.appendChild(s);}}
function batsAt(el,t){[...el.children].forEach((b,k)=>{const i=+b.dataset.i;const sp=18+(i*7)%14;const y=90+((i*137)%260);const x=((i*331)%1920 + t*sp*3)%2100-90;const flap=0.75+0.25*Math.sin(t*9+i);const sc=0.6+((i*53)%10)/14;
  b.style.transform=`translate(${x}px,${y+Math.sin(t*1.3+i)*10}px) scale(${sc},${sc*flap})`;});}
batsInto($('#bats'),5,1);batsInto($('#sbats'),6,11);

/* build window */
const cam=$('#cam');cam.appendChild($('#winTpl').content.cloneNode(true));
const W={scroll:cam.querySelector('.scroll'),txt:cam.querySelector('.composer .txt'),send:cam.querySelector('.sendbtn'),
  hint:cam.querySelector('.hint'),today:cam.querySelector('.today'),main:cam.querySelector('.main'),win:cam.querySelector('.win')};
let overlay=document.createElement('div');W.win.appendChild(overlay);
let cursor=document.createElementNS('http://www.w3.org/2000/svg','svg');cursor.setAttribute('class','cursor');cursor.setAttribute('viewBox','0 0 26 36');cursor.innerHTML='<use href="#cursorS"/>';cam.appendChild(cursor);

const WX=320,WY=60; // window origin in frame
function camera(s,fx,fy){ // scale s, keep window-point (fx,fy) at frame center-ish (cy 470 keeps room for caption)
  const px=WX+fx, py=WY+fy; const cx=960, cy=470;
  let tx=cx-px*s, ty=cy-py*s;
  // clamp so window edges don't leave big gaps when zoomed
  cam.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;}
function cur(x,y,down){cursor.style.display='block';cursor.style.transform=`translate(${WX+x}px,${WY+y}px) scale(${down?0.9:1})`;}

const CHK='<span class="check"><svg viewBox="0 0 12 12"><path d="M2.5 6.2l2.3 2.3 4.7-5"/></svg></span>';
function dots(t){return '<span class="dots">'+[0,1,2].map(i=>`<i style="opacity:${0.35+0.65*Math.max(0,Math.sin(t*6-i*.9))}"></i>`).join('')+'</span>';}

const PLAN=`
 <div class="did">${CHK}<b>What Noah did</b><span class="m">· 1m 47s</span><span class="sw">Show work &#x2335;</span></div>
 <div class="card" style="margin-top:10px;padding:32px 26px 28px">
   <div class="bar" style="width:100%"></div>
   <div class="rv" data-k="0"><div class="sec">SITUATION</div>
   <div class="sit">Your PC is loading seven programs at every startup plus a busy background load — that's what's making it feel slow. I also found ~12 GB of old FL Studio installers you can reclaim.</div></div>
   <div class="rv" data-k="1"><div class="sec">WHAT NOAH CHECKED</div>
   <div class="stats">
     <div class="stat"><div class="k">STARTUP ITEMS</div><div class="v">7 launch</div><div class="s">Battle.net, Teams, Av...</div></div>
     <div class="stat"><div class="k">C: DRIVE FREE</div><div class="v">58 GB / 476 GB</div><div class="s">87% full — tight but...</div></div>
     <div class="stat"><div class="k">OLD FL STUDIO</div><div class="v" style="color:#eef0f3">~12 GB</div><div class="s">in Downloads, old v...</div></div>
     <div class="stat"><div class="k">BACKGROUND APPS</div><div class="v">~30 apps</div><div class="s">Xbox, Avid, Teams, E...</div></div>
   </div></div>
   <div class="rv" data-k="2"><div class="sec">WHAT NOAH WOULD DO</div>
   <div class="steps">
     <div class="st"><div class="num">1</div><div><div class="a">Stop 3 heavy apps from auto-launching at boot</div><div class="b">Battle.net, Avid Link, Edge autolaunch — reversible anytime</div></div></div>
     <div class="st"><div class="num">2</div><div><div class="a">Stop Teams from auto-starting at boot</div><div class="b">Reversible; Teams still opens on demand</div></div></div>
     <div class="st"><div class="num">3</div><div><div class="a">Clear temp files to free space</div><div class="b">Safe, ~0.5 GB temp cache</div></div></div>
     <div class="st"><div class="num">4</div><div><div class="a">Reclaim old FL Studio installers</div><div class="b">Move ~14 old installers to Trash — keep the newest one</div></div></div>
   </div></div>
   <div class="rv" data-k="3"><div class="cta" id="ctaBtn">Trim startup &amp; clear space &#x2192;</div></div>
 </div>`;

function resetWin(){overlay.innerHTML='';overlay.className='';cursor.style.display='none';W.hint.style.display='none';W.today.style.display='none';W.scroll.style.transform='';}

/* ---------- UI scenes ---------- */
function ui1(t){ // 6.0s  describe it
  resetWin();
  const msg='My PC feels slow';
  const n=Math.floor(msg.length*seg(t,0.5,2.1));
  const sent=t>=2.55;
  if(!sent){W.txt.innerHTML=n?`<span class="typed">${msg.slice(0,n)}</span><span class="caret" style="opacity:${(Math.floor(t*2.2)%2)?1:.15}"></span>`:`What's broken? Tell Noah and hit go.`;
    W.send.className='sendbtn'+(n==msg.length?' go':'');W.send.innerHTML=n==msg.length?'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>':'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6f7480" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';}
  else{W.txt.innerHTML=`What's broken? Tell Noah and hit go.`;W.send.className='sendbtn stop';W.send.innerHTML='<i></i>';W.today.style.display='block';}
  const b=eo(seg(t,2.55,2.95)), l=eo(seg(t,3.05,3.5));
  W.scroll.innerHTML=`<div style="height:30px"></div>
    <div class="bubble" style="opacity:${b};transform:translateY(${(1-b)*16}px)">My PC feels slow</div>
    <div style="height:46px"></div>
    <div class="card looking" style="opacity:${l};transform:translateY(${(1-l)*16}px)">
      <div class="bar" style="width:${100*((t*0.35)%1)}%;left:${0}"></div>${dots(t)}<span>Looking into it…</span></div>`;
  // camera: start on composer, rise to conversation
  const k=ease(seg(t,2.4,3.6));
  const s=lerp(1.32,1.18,k)+0.02*seg(t,3.6,6);
  camera(s, 812, lerp(787,200,k));
}
function ui2(t){ // 7.0s  the real cause
  resetWin();W.today.style.display='block';W.hint.style.display='block';
  W.txt.innerHTML='...or tell Noah to do it differently';W.send.className='sendbtn';W.send.innerHTML='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8c919c" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  W.scroll.innerHTML='<div style="height:22px"></div>'+PLAN;
  W.scroll.querySelectorAll('.rv').forEach(e=>{const k=+e.dataset.k;const a=eo(seg(t,0.15+k*0.45,0.65+k*0.45));e.style.opacity=a;e.style.transform=`translateY(${(1-a)*14}px)`;});
  // camera path: situation -> stats -> plan
  const a=ease(seg(t,0.0,2.2)), b=ease(seg(t,3.0,5.2));
  const s=lerp(lerp(1.05,1.30,a),1.22,b);
  const fy=lerp(lerp(220,215,a),520,b);
  camera(s,812,fy);
  const h=seg(t,5.6,6.4); const btn=W.scroll.querySelector('#ctaBtn'); if(btn&&h>0){btn.style.filter=`brightness(${1+0.15*h})`;}
  if(t>4.8){const m=ease(seg(t,4.8,6.2));cur(lerp(1150,880,m),lerp(930,786,m),t>6.45&&t<6.6);}
}
function ui3(t){ // 5.0s  approve it
  resetWin();W.today.style.display='block';
  W.txt.innerHTML=`What's broken? Tell Noah and hit go.`;W.send.className='sendbtn stop';W.send.innerHTML='<i></i>';
  W.scroll.innerHTML='<div style="height:22px"></div>'+PLAN;
  W.main.style.filter='';
  const fadeOut=seg(t,4.2,4.8), d=eo(seg(t,0.1,0.55));
  const blur=6*(1-fadeOut);
  cam.querySelector('.body').style.filter=`blur(${blur}px) brightness(${1-0.35*(1-fadeOut)})`;
  const hover=t>2.6, press=t>3.3&&t<3.5;
  overlay.innerHTML=`<div class="dlg" style="opacity:${d*(1-fadeOut)};transform:scale(${lerp(.94,1,d)})">
    <div class="hd"><div class="warn"><svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg></div><div class="q">Can Noah do this?</div></div>
    <div class="m">Noah needs your OK to continue.</div>
    <div class="btns"><div class="btn no">No thanks</div>
      <div class="btn go" style="transform:scale(${press?.95:1});box-shadow:${hover?'0 0 0 3px rgba(139,143,248,.35), 0 8px 26px rgba(99,102,241,.45)':'none'};filter:brightness(${hover?1.12:1})">Go ahead</div>
      <div class="btn all">Approve all</div></div></div>`;
  const m=ease(seg(t,0.8,2.6));
  cur(lerp(1060,650,m),lerp(860,588,m),press);
  const s=lerp(1.12,1.42,ease(seg(t,0,3.2)));
  camera(s,lerp(640,620,m),lerp(470,500,m));
}
function ui4(t){ // 6.0s  done
  resetWin();W.today.style.display='block';cam.querySelector('.body').style.filter='';
  W.txt.innerHTML=`What's broken? Tell Noah and hit go.`;
  const fin=t>=2.0;
  W.send.className='sendbtn'+(fin?'':' stop');W.send.innerHTML=fin?'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8c919c" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg>':'<i></i>';
  const p1=t>0.7, p2=t>1.5;
  const r=eo(seg(t,2.0,2.5));
  const mb=Math.round(450*eo(seg(t,2.5,3.6)));
  const prog=`<div class="card progress" style="padding:14px 24px;margin-top:22px"><div class="bar" style="width:${fin?100:Math.min(100,t*55)}%"></div>
      <div class="p">${p1?CHK:'<span class="spinner" style="transform:rotate('+t*360+'deg)"></span>'}Turning off a startup program — Teams</div>
      <div class="p" style="opacity:${t>0.7?1:.35}">${p2?CHK:'<span class="spinner" style="transform:rotate('+t*360+'deg)"></span>'}Clearing temp files</div></div>`;
  const res=`<div style="opacity:${r};transform:translateY(${(1-r)*18}px)">
    <div class="noahmeta" style="margin-top:26px"><b>Noah</b>· 09:06 PM</div>
    <div class="did">${CHK}<b>What Noah did</b><span class="m">· 36s</span><span class="sw">Show work &#x2335;</span></div>
    <div class="card res" style="margin-top:10px;padding:30px 26px 26px"><div class="bar" style="width:100%;background:linear-gradient(90deg,#34c9a3,#5eead4)"></div>
      <div class="sec">RESULT</div><div class="big">Done.</div>
      <div class="sit" style="margin-bottom:22px">Teams no longer launches at startup (it still opens fine on demand), and I cleared ~450 MB of temp files. Next boot should feel a bit lighter.</div>
      <div class="sec">WHAT NOAH CHECKED</div>
      <div class="stats" style="margin-bottom:0">
        <div class="stat"><div class="k">TEAMS AT STARTUP</div><div class="v" style="color:var(--teal)">Now off</div><div class="s">Disabled, reversible anytime</div></div>
        <div class="stat"><div class="k">TEMP FILES CLEARED</div><div class="v" style="color:var(--teal)">~${mb} MB</div><div class="s">~450 MB freed</div></div>
        <div class="stat"><div class="k">STILL ON AT BOOT</div><div class="v" style="color:#eef0f3">3 items</div><div class="s">Battle.net, Avid Link, Edge</div></div>
      </div></div></div>`;
  W.scroll.innerHTML=`<div style="height:8px"></div><div class="approved">Approved: Action approved</div>`+prog+res;
  const shift=ease(seg(t,1.9,2.9))*250;
  W.scroll.style.transform=`translateY(${-shift}px)`;
  const s=lerp(1.16,1.30,ease(seg(t,2.2,6)));
  camera(s,812,lerp(170,310,ease(seg(t,1.9,3.0))));
}

function splash(t){ // 6.5s
  const f=1-seg(t,0,0.6); $('#sfade').style.opacity=f;
  const b=eo(seg(t,0.2,1.0)); $('#brand').style.opacity=b; $('#brand').style.transform=`translateY(${(1-b)*20}px)`;
  $('#divider').style.opacity=eo(seg(t,0.6,1.2));
  const tags=[['.d1',0.25],['.d2',1.65],['.d3',3.0]];
  tags.forEach(([c,a])=>{const e=$('#tag '+c);const k=eo(seg(t,a,a+0.45));e.style.opacity=k;e.style.transform=`translateX(${(1-k)*30}px)`;});
  const c=eo(seg(t,3.95,4.5)); $('#ctaRow').style.opacity=c; $('#ctaRow').style.transform=`translateY(${(1-c)*16}px)`;
  $('#fog').style.transform=`translateX(${Math.sin(t*.4)*60}px)`;
  batsAt($('#sbats'),t+3);
}

function render(name,t){
  document.querySelectorAll('.scene').forEach(s=>s.classList.remove('on'));
  if(name==='splash'){$('#splash').classList.add('on');splash(t);return;}
  $('#ui').classList.add('on');batsAt($('#bats'),t+(name.length*3));
  cam.querySelector('.body').style.filter='';
  $('#uifade').style.opacity=0;
  ({ui1,ui2,ui3,ui4})[name](t);
}
function caption(html,ui){document.body.classList.add('cap');document.documentElement.style.background='transparent';document.querySelectorAll('.scene').forEach(s=>s.classList.remove('on'));
  $('#capScene').classList.add('on');const c=$('#capText');c.innerHTML=html;c.className='cap'+(ui?' ui':'');}
window.render=render;window.caption=caption;
const q=new URLSearchParams(location.search);
if(q.get('s'))render(q.get('s'),+(q.get('t')||0));
</script>
</body>
</html>
