<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--cream:#ECE8DF;--ink:#2A251F;--navy:#1A1D61}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;color:var(--ink);background:var(--cream);overflow:hidden}
.serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400}
.frame{position:relative;background:radial-gradient(ellipse at 50% 40%,#F7F4EE 0%,var(--cream) 65%);overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;background:linear-gradient(90deg,#2563EB,#7C3AED);box-shadow:0 24px 50px -16px rgba(76,64,237,.65);position:relative}
.no{display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:rgba(42,37,31,.6);border:3px solid rgba(42,37,31,.18)}
.cur{position:absolute}
.pill{display:inline-block;border:3px solid var(--navy);color:var(--navy);font-weight:800;border-radius:999px}
/* vertical */
#v{width:1080px;height:1920px}
#v .mark{position:absolute;left:340px;top:170px;width:400px}
#v h1{position:absolute;left:50px;right:50px;top:610px;text-align:center;font-weight:800;font-size:150px;letter-spacing:-0.045em;line-height:.98}
#v .s{position:absolute;left:0;right:0;top:1090px;text-align:center;font-size:170px;color:var(--navy);line-height:1}
#v .row{position:absolute;left:90px;right:90px;top:1380px;display:flex;gap:26px}
#v .no{flex:0 0 300px;height:150px;border-radius:30px;font-size:48px}
#v .btn{flex:1;height:150px;border-radius:30px;font-size:60px}
#v .cur{left:690px;top:1460px;width:110px}
#v .pill{position:absolute;left:50%;transform:translateX(-50%);top:1690px;font-size:50px;padding:20px 46px}
/* landscape */
#h{width:1280px;height:720px}
#h .mark{position:absolute;left:880px;top:80px;width:330px}
#h .eb{position:absolute;left:70px;top:70px;font-size:38px;font-weight:700;color:rgba(42,37,31,.55)}
#h h1{position:absolute;left:66px;top:120px;font-weight:800;font-size:118px;letter-spacing:-0.045em;line-height:.98}
#h .s{position:absolute;left:66px;top:375px;font-size:120px;color:var(--navy);line-height:1}
#h .row{position:absolute;left:70px;top:540px;display:flex;gap:18px}
#h .no{width:200px;height:100px;border-radius:22px;font-size:34px}
#h .btn{width:360px;height:100px;border-radius:22px;font-size:44px}
#h .cur{left:470px;top:595px;width:76px}
#h .pill{position:absolute;left:860px;top:560px;font-size:34px;padding:14px 32px}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mk" viewBox="0 0 120 120"><defs><clipPath id="c1"><circle cx="60" cy="58" r="34"/></clipPath>
<linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(37,99,235,0.068)"/><stop offset="1" stop-color="rgba(37,99,235,0.150)"/></linearGradient>
<linearGradient id="g3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
<g clip-path="url(#c1)"><rect x="24" y="22" width="72" height="52" fill="#fff"/><rect x="24" y="22" width="72" height="52" fill="url(#g2)"/><rect x="24" y="74" width="72" height="20" fill="url(#g3)"/></g>
<circle cx="60" cy="58" r="34" fill="none" stroke="#1A1D61" stroke-width="7"/><line x1="16" y1="74" x2="104" y2="74" stroke="#1A1D61" stroke-width="7"/></symbol>
<symbol id="cr" viewBox="0 0 32 32"><path d="M6 3 L6 25 L11.5 19.8 L15.2 28 L19 26.3 L15.4 18.3 L23 18.3 Z" fill="#1d1b18" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></symbol>
</defs></svg>

<div id="v" class="frame">
  <svg class="mark" viewBox="0 0 120 120"><use href="#mk"/></svg>
  <h1>Would you let an AI touch your Mac?</h1>
  <div class="s serif">It asks first.</div>
  <div class="row"><div class="no">Not now</div><div class="btn">Approve</div></div>
  <svg class="cur" viewBox="0 0 32 32"><use href="#cr"/></svg>
  <div class="pill">www.onnoah.app</div>
</div>

<div id="h" class="frame">
  <svg class="mark" viewBox="0 0 120 120"><use href="#mk"/></svg>
  <div class="eb">The best part of Noah</div>
  <h1>An AI that<br>asks first.</h1>
  <div class="s serif">You approve.</div>
  <div class="row"><div class="no">Not now</div><div class="btn">Approve</div></div>
  <svg class="cur" viewBox="0 0 32 32"><use href="#cr"/></svg>
  <div class="pill">www.onnoah.app</div>
</div>
</body></html>
